<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>SA University Portal - Dashboard</title>
    <link rel="stylesheet" href="styles.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <script src="https://unpkg.com/@supabase/supabase-js"></script>
  </head>
  <body>
    <div class="animated-bg"></div>

    <!-- Navbar -->
    <nav class="navbar">
      <div class="nav-brand">
        <i class="fas fa-graduation-cap"></i> SA University Portal
      </div>

      <div class="nav-actions">
        <button id="theme-toggle" class="theme-toggle">🌙</button>
        <button id="logoutBtn" class="logout-btn">
          <i class="fas fa-sign-out-alt"></i> Logout
        </button>
      </div>
    </nav>

    <!-- Dashboard -->
    <div class="dashboard-container">
      <section class="hero">
        <h1 class="gradient-text">
          Welcome, <span id="username">Student</span>!
        </h1>
        <p>
          Enter your Matric results (at least 6 subjects) to see eligible
          university courses.
        </p>
      </section>

      <!-- Marks Form -->
      <div class="container">
        <form id="marksForm" class="floating-form">
          <div class="form-group">
            <input
              type="number"
              id="english"
              placeholder=" "
              min="0"
              max="100"
              required
            /><label for="english">English (%)</label>
          </div>
          <div class="form-group">
            <input
              type="number"
              id="secondLanguage"
              placeholder=" "
              min="0"
              max="100"
            /><label for="secondLanguage">Second Language (%)</label>
          </div>
          <div class="form-group">
            <input
              type="number"
              id="math"
              placeholder=" "
              min="0"
              max="100"
            /><label for="math">Mathematics (%)</label>
          </div>
          <div class="form-group">
            <input
              type="number"
              id="lifeOrientation"
              placeholder=" "
              min="0"
              max="100"
            /><label for="lifeOrientation">Life Orientation (%)</label>
          </div>
          <div class="form-group">
            <input
              type="number"
              id="physics"
              placeholder=" "
              min="0"
              max="100"
            /><label for="physics">Physical Sciences (%)</label>
          </div>
          <div class="form-group">
            <input
              type="number"
              id="accounting"
              placeholder=" "
              min="0"
              max="100"
            /><label for="accounting">Accounting (%)</label>
          </div>
          <div class="form-group">
            <input
              type="number"
              id="history"
              placeholder=" "
              min="0"
              max="100"
            /><label for="history">History (%)</label>
          </div>
          <div class="form-group">
            <input
              type="number"
              id="geography"
              placeholder=" "
              min="0"
              max="100"
            /><label for="geography">Geography (%)</label>
          </div>

          <button type="submit" class="glow-button">
            <i class="fas fa-check"></i> Check Eligibility
          </button>
        </form>
      </div>

      <!-- Results -->
      <section id="results" class="results-card hidden">
        <div class="nav-brand">
          <i class="fas fa-graduation-cap"></i> Eligible Courses
        </div>
        <div id="coursesList" class="courses-grid"></div>
      </section>
    </div>

    <footer>
      Made with <span class="pulse">❤️</span> for South African students
    </footer>

    <script src="script.js"></script>
    <script src="https://kit.fontawesome.com/a076d05399.js"></script>
  </body>
</html>
